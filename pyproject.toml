[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-study"
version = "0.1.0"
description = "Budget-matched Triton optimization with role and knowledge ablations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2.3", "matplotlib>=3.8"]

[project.optional-dependencies]
gpu = ["torch>=2.5", "triton>=3.1; sys_platform == 'linux'"]
test = ["pytest>=8"]

[project.scripts]
kernel-study = "kernel_study.cli:main"

[tool.setuptools.packages.find]
include = ["kernel_study*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

